# Scarica automaticamente notizie, video, risultati e sintesi ogni ora
# e pubblica l'app su GitHub Pages. Nessun PC necessario.
name: Aggiorna MyTaste

on:
  schedule:
    - cron: "17 * * * *"   # ogni ora
  push:
    paths:
      - "sources.json"
      - "site/**"
      - "scripts/**"
      - ".github/workflows/update.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Scarica i contenuti
        run: node scripts/fetch.mjs
      - name: Prepara il sito
        run: cp sources.json site/sources.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
